<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2b2140"/>
      <stop offset="1" stop-color="#120d1c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d77a"/>
      <stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="48" fill="url(#bg)"/>
  <!-- icon grid -->
  <g stroke="#5b4a7a" stroke-width="4">
    <rect x="52"  y="52"  width="72" height="72" rx="10" fill="#3a2d55"/>
    <rect x="140" y="52"  width="72" height="72" rx="10" fill="#2f4a5e"/>
    <rect x="228" y="52"  width="72" height="72" rx="10" fill="#5a2f3a"/>
    <rect x="52"  y="140" width="72" height="72" rx="10" fill="#2f5a3e"/>
    <rect x="140" y="140" width="72" height="72" rx="10" fill="#5a4a2f"/>
    <rect x="52"  y="228" width="72" height="72" rx="10" fill="#4a2f5a"/>
  </g>
  <!-- magnifying glass -->
  <circle cx="236" cy="236" r="78" fill="#1a1428" fill-opacity="0.75" stroke="url(#gold)" stroke-width="22"/>
  <rect x="290" y="290" width="40" height="96" rx="16" fill="url(#gold)" transform="rotate(-45 310 338)"/>
  <circle cx="212" cy="212" r="18" fill="#ffffff" fill-opacity="0.35"/>
</svg>
